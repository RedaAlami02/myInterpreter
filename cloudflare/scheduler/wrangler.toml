name = "myinterpreter-scheduler"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Every trigger is safe to repeat because the GitHub side is idempotent:
#  - every 15 minutes through the Casablanca session, dispatch the order-book
#    capture (it refuses to run outside the session window anyway).
#  - every 15 minutes through the evening, dispatch the close job. Its preflight
#    publishes once and exits immediately afterwards.
#  - once a day, check that a close actually published and that the site and
#    the health audit are fine; alert if not.
[triggers]
crons = ["*/15 8-15 * * 1-5", "5,20,35,50 8-15 * * 1-5", "0,30 16-20 * * 1-5", "0 22 * * *"]

[vars]
GITHUB_REPO = "RedaAlami02/myInterpreter"
SITE_URL = "https://myinterpreter.infinityfree.me/"
