name: Deploy PHP runtime files

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Upload the selected files (otherwise dry-run only)
        type: boolean
        default: false
      files:
        description: Space-separated runtime paths
        type: string
        default: "reconciliation.php core/SupabaseAdmin.php core/SupabaseMarket.php core/backend.php core/sidebar.php"

permissions:
  contents: read

concurrency:
  group: deploy-php
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      FILES: ${{ github.event.inputs.files }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      FTP_REMOTE_PATH: ${{ secrets.FTP_REMOTE_PATH }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate selected paths
        run: |
          python3 - <<'PY'
          import os, pathlib
          allowed_roots = ("core/", "handlers/", "assets/", "config/", "locales/")
          for path in os.environ.get("FILES", "").split():
              if not path:
                  continue
              p = pathlib.Path(path)
              if p.is_absolute() or ".." in p.parts:
                  raise SystemExit(f"Refusing absolute or parent path: {path}")
              if len(p.parts) > 1 and not path.startswith(allowed_roots):
                  raise SystemExit(f"Refusing non-runtime path: {path}")
              if p.suffix != ".php" and len(p.parts) == 1:
                  raise SystemExit(f"Refusing non-PHP root file: {path}")
              if not p.is_file():
                  raise SystemExit(f"Missing file: {path}")
          PY

      - name: Dry run
        if: github.event.inputs.apply != 'true'
        run: python3 deploy.py --dry-run $FILES

      - name: Deploy
        if: github.event.inputs.apply == 'true'
        run: python3 deploy.py $FILES

      - name: Summary
        run: |
          echo "## PHP deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: ${{ github.event.inputs.apply == 'true' && 'APPLIED' || 'DRY RUN' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$FILES" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
