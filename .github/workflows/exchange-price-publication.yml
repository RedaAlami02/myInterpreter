name: Exchange price publication

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Optional comma-separated symbols (empty = entire universe)
        type: string
        default: ""
      force:
        description: Publish even when today's close is already stored
        type: boolean
        default: true
  schedule:
    # GitHub skips or delays sparse crons (the 16:45 slot fired at 01:51 the
    # next day, and not at all on 2026-11-19). A frequent schedule with a cheap
    # preflight is self-healing: it decides per slot whether the close is
    # missing (publish everything) or only the quotes are stale (one request).
    # 08:00-15:59 UTC covers the Casablanca session in both UTC+0 and UTC+1.
    - cron: "*/15 8-15 * * 1-5"
    # Safety net for a missed close: after the session every run is a cheap
    # no-op unless the day's `data` row is still missing.
    - cron: "*/30 16-20 * * 1-5"

permissions:
  contents: read

concurrency:
  group: exchange-price-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.EXCHANGE_PRICE_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      SYMBOLS: ${{ github.event.inputs.symbols }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight — is the close missing or are the quotes stale?
        id: preflight
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo '{"run": true, "mode": "CLOSE", "reason": "FORCED"}'
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=CLOSE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/preflight_daily_close.py | tee "$RUNNER_TEMP/preflight.json"
          run=$(python3 -c "import json;print('true' if json.load(open('$RUNNER_TEMP/preflight.json')).get('run') else 'false')")
          mode=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/preflight.json')).get('mode') or 'NONE')")
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Capture current exchange prices
        if: steps.preflight.outputs.run == 'true'
        env:
          MODE: ${{ steps.preflight.outputs.mode }}
        run: |
          extra=""
          if [ "$MODE" = "INTRADAY" ]; then extra="--prices-only"; fi
          python3 tools/capture_exchange_pages.py \
            --out-dir "$RUNNER_TEMP/exchange-prices/capture" \
            --symbols "$SYMBOLS" \
            --delay 0.7 $extra

      - name: Publish prices
        if: steps.preflight.outputs.run == 'true'
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 tools/publish_exchange_prices.py \
            --snapshot "$RUNNER_TEMP/exchange-prices/capture/snapshot.json" \
            --apply | tee "$RUNNER_TEMP/exchange-prices/result.json"

      - name: Publish daily history
        if: >-
          steps.preflight.outputs.run == 'true' &&
          steps.preflight.outputs.mode == 'CLOSE'
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 tools/publish_exchange_history.py \
            --snapshot "$RUNNER_TEMP/exchange-prices/capture/snapshot.json" \
            --actions "$RUNNER_TEMP/exchange-prices/capture/actions.json" \
            --apply | tee "$RUNNER_TEMP/exchange-prices/result_history.json"

      - name: Record daily valuations
        if: >-
          steps.preflight.outputs.run == 'true' &&
          steps.preflight.outputs.mode == 'CLOSE'
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 tools/record_daily_valuations.py --apply | tee "$RUNNER_TEMP/exchange-prices/result_valuations.json"

      - name: Publish dividends
        if: >-
          steps.preflight.outputs.run == 'true' &&
          steps.preflight.outputs.mode == 'CLOSE' &&
          (vars.EXCHANGE_DIVIDEND_PUBLICATION_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 tools/publish_exchange_dividends.py \
            --snapshot "$RUNNER_TEMP/exchange-prices/capture/snapshot.json" \
            --apply | tee "$RUNNER_TEMP/exchange-prices/result_dividends.json"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Exchange price publication"
            for result in result.json result_history.json result_valuations.json result_dividends.json; do
              echo "\`\`\`json"
              cat "$RUNNER_TEMP/exchange-prices/$result" 2>/dev/null || echo '{"status":"NO_RESULT"}'
              echo "\`\`\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exchange-prices-${{ github.run_id }}
          path: ${{ runner.temp }}/exchange-prices
          retention-days: 14
          if-no-files-found: warn
