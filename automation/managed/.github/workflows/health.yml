name: Website and collection health
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: Sanitized current database health snapshot from the private timer
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: private-operational-health
  cancel-in-progress: false
jobs:
  health:
    if: github.event.repository.private && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/worker-deps" -r requirements.txt
          echo "PYTHONPATH=$RUNNER_TEMP/worker-deps" >> "$GITHUB_ENV"
      - name: Check storage, collection coverage and official close
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_SNAPSHOT: ${{ inputs.snapshot }}
        run: python3 health_check.py
